name: Offline tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP adapter and code checks
        run: python -m pip install requests==2.32.3 -r requirements-dev.txt
      - name: Test synthetic workflow and audit candidate registry
        run: bash scripts/check.sh
      - name: Check Python style
        run: |
          python -m ruff check genshin_research
          python -m ruff format --check genshin_research
